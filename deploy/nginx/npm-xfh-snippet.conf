# Paste into Nginx Proxy Manager → Proxy Host → Advanced (both poreiago.com
# and achilliotravel.com). Without X-Forwarded-Host, Contabo often forwards
# Host as 127.0.0.1:8003 and the SPA shell map cannot pick Achillio vs PoreiaGo.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
