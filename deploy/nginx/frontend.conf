# Dual server blocks — Googlebot reads <title> from the SPA HTML file.
# Contabo nginx ignored $spa_index map/try_files vars; server_name is reliable.
# Achillio Travel must never advertise PoreiaGo in SERPs.

map $host $spa_doc_title {
    default "PoreiaGo — Πλατφόρμα για ταξιδιωτικά γραφεία";
    ~*(^|\.)achilliotravel\.com$ "Achillio Travel";
}

map $host $spa_doc_app_name {
    default "PoreiaGo";
    ~*(^|\.)achilliotravel\.com$ "Achillio Travel";
}

# --- Achillio Travel office domain ---
server {
    listen 80;
    server_name achilliotravel.com www.achilliotravel.com;
    root /usr/share/nginx/html;
    index index.achillio.html;

    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter 'PoreiaGo — Πλατφόρμα για ταξιδιωτικά γραφεία' 'Achillio Travel';
    sub_filter 'name="application-name" content="PoreiaGo"' 'name="application-name" content="Achillio Travel"';

    include /etc/nginx/conf.d/frontend-shared.inc;

    location = /rent {
        try_files /index.achillio.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /rent/ {
        try_files /index.achillio.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /driver {
        try_files /index.achillio.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /driver/ {
        try_files /index.achillio.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /wallet {
        try_files /index.achillio.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /wallet/ {
        try_files /index.achillio.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /login {
        try_files /index.achillio.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /register {
        try_files /index.achillio.html =404;
        add_header Cache-Control "no-cache";
    }

    # Hard-coded Achillio shell — no map/variable try_files.
    location / {
        try_files $uri /index.achillio.html;
    }
}

# --- PoreiaGo marketing + default ---
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter 'PoreiaGo — Πλατφόρμα για ταξιδιωτικά γραφεία' '$spa_doc_title';
    sub_filter 'name="application-name" content="PoreiaGo"' 'name="application-name" content="$spa_doc_app_name"';

    include /etc/nginx/conf.d/frontend-shared.inc;

    location = /rent {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /rent/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /driver {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /driver/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /wallet {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /wallet/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /login {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /register {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
