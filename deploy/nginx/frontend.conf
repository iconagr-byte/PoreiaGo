# Dual server blocks for SPA document titles (Googlebot reads static HTML).
# Default index.html is Achillio Travel — Contabo often ignores Host routing, so
# the shared default shell must be SERP-safe for achilliotravel.com.
# poreiago.com explicitly serves index.poreiago.html (marketing title).

map $host $spa_doc_title {
    default "Achillio Travel";
    ~*(^|\.)poreiago\.com$ "PoreiaGo — Πλατφόρμα για ταξιδιωτικά γραφεία";
    ~*(^|\.)achilliotravel\.com$ "Achillio Travel";
}

map $host $spa_doc_app_name {
    default "Achillio Travel";
    ~*(^|\.)poreiago\.com$ "PoreiaGo";
    ~*(^|\.)achilliotravel\.com$ "Achillio Travel";
}

# --- PoreiaGo marketing ---
server {
    listen 80;
    server_name poreiago.com www.poreiago.com;
    root /usr/share/nginx/html;
    index index.poreiago.html;

    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter 'Achillio Travel' 'PoreiaGo — Πλατφόρμα για ταξιδιωτικά γραφεία';
    sub_filter 'name="application-name" content="Achillio Travel"' 'name="application-name" content="PoreiaGo"';

    include /etc/nginx/conf.d/frontend-shared.inc;

    location = /rent {
        try_files /index.poreiago.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /rent/ {
        try_files /index.poreiago.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /driver {
        try_files /index.poreiago.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /driver/ {
        try_files /index.poreiago.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /wallet {
        try_files /index.poreiago.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /wallet/ {
        try_files /index.poreiago.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /login {
        try_files /index.poreiago.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /register {
        try_files /index.poreiago.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.poreiago.html;
    }
}

# --- Achillio Travel + default (SERP-safe) ---
server {
    listen 80 default_server;
    server_name achilliotravel.com www.achilliotravel.com _;
    root /usr/share/nginx/html;
    index index.html;

    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter 'PoreiaGo — Πλατφόρμα για ταξιδιωτικά γραφεία' 'Achillio Travel';
    sub_filter 'name="application-name" content="PoreiaGo"' 'name="application-name" content="Achillio Travel"';

    include /etc/nginx/conf.d/frontend-shared.inc;

    location = /rent {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /rent/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /driver {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /driver/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /wallet {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /wallet/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /login {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /register {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
