server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Docker embedded DNS — re-resolve api-blue after container recreate.
    # Without a variable proxy_pass, nginx caches the old upstream IP and
    # /api (drivers list, etc.) dies with Failed to fetch / 502 until frontend restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API proxy — bypasses flaky api.poreiago.com Traefik router.
    # Browser talks only to www; nginx reaches api-blue on the Docker edge network.
    location /api/ {
        set $api_upstream api-blue:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        client_max_body_size 12m;
        # Keep the public hostname so DomainTenantMiddleware can map custom domains.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location /ws/ {
        set $api_upstream api-blue:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        set $api_upstream api-blue:8000;
        proxy_pass http://$api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Legacy ticketing endpoints only — do NOT proxy /admin SPA routes.
    location ^~ /admin/scan {
        set $api_upstream api-blue:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /admin/boarding {
        set $api_upstream api-blue:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /admin/offline-manifest {
        set $api_upstream api-blue:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /admin/sms {
        set $api_upstream api-blue:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Wallet PWA assets (must NOT live under /wallet/ — that path is the SPA route).
    location ^~ /wallet-pwa/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /wallet-pwa/sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/wallet";
    }

    # Rental customer PWA assets (must NOT live under /rent/ — SPA route).
    location ^~ /rental-pwa/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /rental-pwa/sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/rent";
    }

    # Keep SWs fresh so VAPID rematch / push handler fixes reach devices quickly.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /driver-sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Explicit SPA shells — deep links must never 404 at the edge.
    # Use /rent/ (with slash) so /rental-pwa/* static assets are not swallowed.
    location = /rent {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /rent/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /driver {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /driver/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /wallet {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /wallet/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /login {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /register {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # SPA: never fall through to directory indexes ($uri/) — a static folder
    # named like a React route (e.g. /wallet/) would otherwise 403.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
