# Single server — NPM on Contabo often forwards Host as 127.0.0.1:8003, so
# server_name matching fails. Pick the SPA HTML shell from Host OR
# X-Forwarded-Host (and Referer as last resort).
# Default shell = Achillio Travel (office SERP). PoreiaGo marketing uses
# index.poreiago.html when the request is clearly for poreiago.com.

map $http_x_forwarded_host $spa_from_xfh {
    default "";
    ~*poreiago\.com /index.poreiago.html;
    ~*achilliotravel\.com /index.html;
}

map $host $spa_from_host {
    default "";
    ~*(^|\.)poreiago\.com$ /index.poreiago.html;
    ~*(^|\.)achilliotravel\.com$ /index.html;
}

map $http_referer $spa_from_referer {
    default "";
    ~*poreiago\.com /index.poreiago.html;
    ~*achilliotravel\.com /index.html;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/frontend-shared.inc;

    # Resolve SPA shell: XFH → Host → Referer → Achillio default.
    set $spa_shell /index.html;
    if ($spa_from_referer != "") {
        set $spa_shell $spa_from_referer;
    }
    if ($spa_from_host != "") {
        set $spa_shell $spa_from_host;
    }
    if ($spa_from_xfh != "") {
        set $spa_shell $spa_from_xfh;
    }

    location = /rent {
        try_files $spa_shell =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /rent/ {
        try_files $spa_shell =404;
        add_header Cache-Control "no-cache";
    }
    location = /driver {
        try_files $spa_shell =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /driver/ {
        try_files $spa_shell =404;
        add_header Cache-Control "no-cache";
    }
    location = /wallet {
        try_files $spa_shell =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /wallet/ {
        try_files $spa_shell =404;
        add_header Cache-Control "no-cache";
    }
    location = /login {
        try_files $spa_shell =404;
        add_header Cache-Control "no-cache";
    }
    location = /register {
        try_files $spa_shell =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $spa_shell;
    }
}
