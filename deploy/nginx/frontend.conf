# Single server — NPM on Contabo often forwards Host as 127.0.0.1:8003, so
# server_name matching fails. Pick the SPA HTML shell from Host OR
# X-Forwarded-Host (and Referer as last resort).
# Document HTML is proxied through /api/site/seo-shell so each office Host
# gets its own <title>/meta (Googlebot never sees PoreiaGo on tenant domains).

map $http_x_forwarded_host $spa_from_xfh {
    default "";
    ~*poreiago\.com /index.poreiago.html;
    ~*achilliotravel\.com /index.html;
}

map $host $spa_from_host {
    default "";
    ~*(^|\.)poreiago\.com$ /index.poreiago.html;
    ~*(^|\.)achilliotravel\.com$ /index.html;
}

map $http_referer $spa_from_referer {
    default "";
    ~*poreiago\.com /index.poreiago.html;
    ~*achilliotravel\.com /index.html;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/frontend-shared.inc;

    # Resolve static SPA shell for fallback when API SEO shell is down.
    set $spa_shell /index.html;
    if ($spa_from_referer != "") {
        set $spa_shell $spa_from_referer;
    }
    if ($spa_from_host != "") {
        set $spa_shell $spa_from_host;
    }
    if ($spa_from_xfh != "") {
        set $spa_shell $spa_from_xfh;
    }

    location = /robots.txt {
        set $api_upstream api-blue:8000;
        proxy_pass http://$api_upstream/api/site/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @robots_fallback;
    }

    location = /sitemap.xml {
        set $api_upstream api-blue:8000;
        proxy_pass http://$api_upstream/api/site/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @sitemap_fallback;
    }

    location = /rent {
        try_files $uri @seo_shell;
    }
    location ^~ /rent/ {
        try_files $uri @seo_shell;
    }
    location = /driver {
        try_files $uri @seo_shell;
    }
    location ^~ /driver/ {
        try_files $uri @seo_shell;
    }
    location = /wallet {
        try_files $uri @seo_shell;
    }
    location ^~ /wallet/ {
        try_files $uri @seo_shell;
    }
    location = /login {
        try_files $uri @seo_shell;
    }
    location = /register {
        try_files $uri @seo_shell;
    }

    location / {
        try_files $uri @seo_shell;
    }

    # Host-aware HTML shell (title + description + JSON-LD).
    location @seo_shell {
        set $api_upstream api-blue:8000;
        proxy_pass http://$api_upstream/api/site/seo-shell;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa_static_fallback;
        add_header Cache-Control "no-cache";
    }

    location @spa_static_fallback {
        try_files $spa_shell =404;
        add_header Cache-Control "no-cache";
    }

    location @robots_fallback {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location @sitemap_fallback {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"></urlset>';
    }
}
