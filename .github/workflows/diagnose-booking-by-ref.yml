name: Diagnose booking by ref (Contabo)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Booking reference / PNR / UUID (e.g. BK-F15C6C28)"
        required: true
        default: "BK-F15C6C28"
        type: string
      purge:
        description: "Also permanently DELETE matching Postgres rows (PURGE=1)"
        required: false
        default: false
        type: boolean
      tenant_slug:
        description: "Optional tenant slug/subdomain filter (e.g. admin-achillio-gr)"
        required: false
        default: ""
        type: string

concurrency:
  group: diagnose-booking-by-ref
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH diagnose booking on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/poreiago
            git fetch origin main
            git reset --hard origin/main
            # Script may not be on main yet — pull from this workflow's commit if needed.
            if [ ! -f deploy/scripts/diagnose-booking-by-ref.sh ]; then
              echo "WARN: diagnose script missing on main — using inline copy from Actions checkout"
            fi
            if [ "${{ inputs.purge }}" = "true" ]; then export PURGE=1; else export PURGE=0; fi
            export REF='${{ inputs.ref }}'
            export TENANT_SLUG='${{ inputs.tenant_slug }}'
            if [ -f deploy/scripts/diagnose-booking-by-ref.sh ]; then
              bash deploy/scripts/diagnose-booking-by-ref.sh
            else
              echo "ERROR: deploy/scripts/diagnose-booking-by-ref.sh not found after reset"
              exit 1
            fi
