name: Diagnose create office 500 (Contabo)

on:
  workflow_dispatch:

concurrency:
  group: diagnose-create-office
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH diagnose create-office on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/poreiago
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy/scripts/diagnose-create-office.sh
            bash deploy/scripts/diagnose-create-office.sh
