name: Set Google Client ID (VPS)

# One-shot / ops: write GOOGLE_CLIENT_ID to deploy/.env.prod and recreate API.
# Client ID is public (embedded in the browser). Do NOT pass Client Secret here —
# GIS ID-token login does not use it.
#
# REQUIRED repo secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY

on:
  workflow_dispatch:
    inputs:
      google_client_id:
        description: "OAuth Web Client ID (….apps.googleusercontent.com)"
        required: true
        type: string

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  set-google-client-id:
    runs-on: ubuntu-latest
    steps:
      - name: Write GOOGLE_CLIENT_ID on VPS and recreate API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -euo pipefail
            CID='${{ inputs.google_client_id }}'
            case "$CID" in
              *.apps.googleusercontent.com) ;;
              *) echo "ERROR: client id must end with .apps.googleusercontent.com"; exit 1 ;;
            esac
            case "$CID" in
              *xxxx*|*example*|*your-client*) echo "ERROR: placeholder client id rejected"; exit 1 ;;
            esac
            ENVF=/opt/poreiago/deploy/.env.prod
            if [ ! -f "$ENVF" ]; then
              echo "ERROR: missing $ENVF"
              exit 1
            fi
            for KEY in GOOGLE_CLIENT_ID VITE_GOOGLE_CLIENT_ID; do
              if grep -q "^${KEY}=" "$ENVF"; then
                sed -i.bak "s|^${KEY}=.*|${KEY}=${CID}|" "$ENVF"
              else
                echo "${KEY}=${CID}" >> "$ENVF"
              fi
            done
            echo "Wrote GOOGLE_CLIENT_ID to $ENVF"
            grep -E '^(GOOGLE_CLIENT_ID|VITE_GOOGLE_CLIENT_ID)=' "$ENVF" | sed 's/=.*/=***redacted***/'
            cd /opt/poreiago
            # Recreate API so runtime /api/auth/google/config picks up the new id.
            if [ -x deploy/scripts/vm-deploy-all.sh ]; then
              # Full rebuild so Vite also bakes VITE_GOOGLE_CLIENT_ID as fallback.
              bash deploy/scripts/vm-deploy-all.sh
            else
              echo "ERROR: deploy/scripts/vm-deploy-all.sh missing"
              exit 1
            fi
            curl -sS -o /tmp/gcfg.json -w "%{http_code}" http://127.0.0.1/api/auth/google/config || true
            echo
            cat /tmp/gcfg.json 2>/dev/null || true
            echo
