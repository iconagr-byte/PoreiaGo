<!doctype html>
<html lang="el" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Source shell for Vite. Production HTML title/description are rewritten
      per office Host by /api/site/seo-shell (nginx @seo_shell). Build also
      writes dist/index.achillio.html + index.poreiago.html as static fallbacks.
    -->
    <title>PoreiaGo — Πλατφόρμα για ταξιδιωτικά γραφεία</title>
    <meta name="description" content="PoreiaGo — πλατφόρμα κρατήσεων, στόλου και wallet για ταξιδιωτικά γραφεία." />
    <meta property="og:title" content="PoreiaGo — Πλατφόρμα για ταξιδιωτικά γραφεία" />
    <meta property="og:description" content="PoreiaGo — πλατφόρμα κρατήσεων, στόλου και wallet για ταξιδιωτικά γραφεία." />
    <meta property="og:site_name" content="PoreiaGo" />
    <meta name="twitter:title" content="PoreiaGo — Πλατφόρμα για ταξιδιωτικά γραφεία" />
    <meta name="application-name" content="PoreiaGo" />
    <style id="poreiago-wallet-native-boot">
      /* Full-bleed My Wallet in Capacitor — no website chrome, fast fade */
      html[data-poreiago-app='wallet'],
      html[data-poreiago-app='wallet'] body,
      html[data-poreiago-app='wallet'] #root {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        min-height: 100% !important;
        background: #ffffff !important;
        overflow-x: hidden !important;
      }
      html[data-poreiago-app='wallet'] .wallet-auth-stage,
      html[data-poreiago-app='wallet'] .wallet-auth-shell,
      html[data-poreiago-app='wallet'] .wallet-auth-scroll,
      html[data-poreiago-app='wallet'] .wallet-auth-panel,
      html[data-poreiago-app='wallet'] .wallet-auth-card {
        background: #ffffff !important;
        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        width: 100% !important;
        max-width: none !important;
      }
      html[data-poreiago-app='wallet'] .wallet-auth-stage {
        min-height: 100dvh !important;
        animation: pgWalletFade 160ms ease-out;
      }
      @keyframes pgWalletFade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      html[data-poreiago-app='wallet'] .wallet-auth-back {
        display: none !important;
      }
      /* Apple boot splash — paints before React so login never flashes first */
      #pg-wallet-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 2rem;
        background:
          radial-gradient(ellipse 100% 60% at 50% 12%, rgba(0, 113, 227, 0.07), transparent 58%),
          linear-gradient(180deg, #ffffff 0%, #f5f5f7 100%);
        font-family: 'Figtree', 'SF Pro Display', 'Avenir Next', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
        transition: opacity 0.38s ease, transform 0.38s ease;
      }
      #pg-wallet-boot-splash.pg-wallet-boot-splash--out {
        opacity: 0;
        transform: scale(1.025);
        pointer-events: none;
      }
      #pg-wallet-boot-splash .pg-boot-glyph {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.75rem;
        border-radius: 1.28rem;
        display: grid;
        place-items: center;
        background: linear-gradient(165deg, #5ac8fa 0%, #0071e3 46%, #0058b0 100%);
        box-shadow:
          0 1.5px 0 rgba(255, 255, 255, 0.45) inset,
          0 18px 40px rgba(0, 113, 227, 0.32);
      }
      #pg-wallet-boot-splash .pg-boot-glyph svg {
        width: 2rem;
        height: 2rem;
        display: block;
      }
      #pg-wallet-boot-splash .pg-boot-word {
        margin: 0;
        font-size: clamp(2.5rem, 10vw, 3.1rem);
        font-weight: 700;
        letter-spacing: -0.06em;
        line-height: 1;
        color: #1d1d1f;
      }
      #pg-wallet-boot-splash .pg-boot-word span {
        background: linear-gradient(115deg, #0071e3, #2997ff 55%, #64d2ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #pg-wallet-boot-splash .pg-boot-hook {
        margin: 1.35rem 0 0;
        font-size: 1.12rem;
        font-weight: 560;
        letter-spacing: -0.03em;
        color: #1d1d1f;
      }
      #pg-wallet-boot-splash .pg-boot-support {
        margin: 0.7rem 0 0;
        font-size: 0.875rem;
        font-weight: 450;
        color: #6e6e73;
      }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        // Capacitor Wallet Android/iOS — mark app shell ASAP for full-bleed CSS
        try {
          var cap = window.Capacitor;
          var ua = String(navigator.userAgent || '');
          var host0 = String(location.hostname || '').toLowerCase();
          var port0 = String(location.port || '');
          var native =
            (cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform()) ||
            (cap && typeof cap.getPlatform === 'function' &&
              /^(android|ios)$/i.test(String(cap.getPlatform() || ''))) ||
            /Capacitor/i.test(ua) ||
            // Packaged Capacitor WebView only — never Vite (:5173) or other local ports
            (host0 === 'localhost' &&
              /^https?:$/.test(location.protocol || '') &&
              (!port0 || port0 === '80' || port0 === '443'));
          if (native) {
            document.documentElement.setAttribute('data-poreiago-app', 'wallet');
            // Cold-start on / must become /wallet before React mounts — no marketing homepage.
            // history.replaceState (not location.replace) so Capacitor does not re-fetch a missing file.
            var path0 = location.pathname || '/';
            var walletOk =
              path0 === '/wallet' ||
              path0.indexOf('/wallet/') === 0 ||
              path0 === '/my-booking' ||
              path0.indexOf('/my-booking/') === 0 ||
              path0 === '/login' ||
              path0 === '/register' ||
              path0.indexOf('/forgot-password') === 0 ||
              path0.indexOf('/reset-password') === 0 ||
              path0.indexOf('/ticket/') === 0 ||
              path0.indexOf('/passenger-checkin') === 0 ||
              path0.indexOf('/wallet/native-google') === 0;
            if (!walletOk) {
              history.replaceState(null, '', '/wallet' + (location.search || '') + (location.hash || ''));
            }
            // Paint PoreiaGo splash before React — login credentials must not appear first.
            function paintBootSplash() {
              if (!document.body || document.getElementById('pg-wallet-boot-splash')) return;
              var boot = document.createElement('div');
              boot.id = 'pg-wallet-boot-splash';
              boot.setAttribute('role', 'dialog');
              boot.setAttribute('aria-label', 'PoreiaGo');
              boot.innerHTML =
                '<div class="pg-boot-glyph" aria-hidden="true">' +
                '<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                '<path d="M6.5 25.5c5.2-9.2 11.6-13.8 18.8-14.6" stroke="#fff" stroke-width="2.35" stroke-linecap="round"/>' +
                '<circle cx="27.2" cy="10.2" r="2.55" fill="#fff"/>' +
                '<path d="M8.2 27.2h12.6c1.85 0 2.95-2 1.95-3.5l-1.7-2.55" stroke="#fff" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>' +
                '</svg></div>' +
                '<p class="pg-boot-word">Poreia<span>Go</span></p>' +
                '<p class="pg-boot-hook">Αξιοπιστία σε κάθε διαδρομή</p>' +
                '<p class="pg-boot-support">Ασφάλεια · άνεση · εμπιστοσύνη</p>';
              document.body.appendChild(boot);
              // Safety: never leave boot splash forever if React fails to mount.
              setTimeout(function () {
                var el = document.getElementById('pg-wallet-boot-splash');
                if (!el) return;
                el.classList.add('pg-wallet-boot-splash--out');
                setTimeout(function () { try { el.remove(); } catch (e2) {} }, 400);
              }, 5200);
            }
            if (document.body) paintBootSplash();
            else document.addEventListener('DOMContentLoaded', paintBootSplash);
          }
        } catch (e) { /* ignore */ }
        var host = (location.hostname || '').toLowerCase();
        // Apex without www was indexed by Google with a stale PoreiaGo title.
        // Prefer www as the single public URL (nginx 301 when Host/XFH survive NPM).
        if (host === 'achilliotravel.com') {
          location.replace(
            'https://www.achilliotravel.com' +
              location.pathname +
              location.search +
              location.hash
          );
          return;
        }
        var apex = host.replace(/^www\./, '');
        var known = { 'achilliotravel.com': 'Achillio Travel — Εκδρομές με λεωφορείο' };
        var knownDesc = {
          'achilliotravel.com':
            'Achillio Travel — εκδρομές με λεωφορείο στην Ελλάδα. Κράτηση θέσης, εισιτήρια και My Wallet στο achilliotravel.com.',
        };
        var platformApex =
          apex === 'poreiago.com' ||
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host === 'api.poreiago.com';
        var parts = apex.split('.');
        var isTenantSub =
          parts.length === 3 &&
          parts[1] === 'poreiago' &&
          parts[2] === 'com' &&
          parts[0] !== 'www' &&
          parts[0] !== 'api' &&
          parts[0] !== 'admin';
        var isTenantCustom = !platformApex && !apex.endsWith('.poreiago.com');
        var title;
        var description = '';
        if (known[apex]) {
          title = known[apex];
          description = knownDesc[apex] || '';
        } else if (isTenantSub || isTenantCustom) {
          var slug = (isTenantSub ? parts[0] : apex.split('.')[0]) || apex;
          title = slug.charAt(0).toUpperCase() + slug.slice(1);
        } else {
          return; // keep PoreiaGo marketing title
        }
        document.title = title;
        function setMeta(attr, key, value) {
          if (!value) return;
          var el = document.querySelector('meta[' + attr + '="' + key + '"]');
          if (!el) {
            el = document.createElement('meta');
            el.setAttribute(attr, key);
            document.head.appendChild(el);
          }
          el.setAttribute('content', value);
        }
        setMeta('property', 'og:title', title);
        setMeta('name', 'twitter:title', title);
        setMeta('name', 'application-name', title.split('—')[0].trim() || title);
        setMeta('property', 'og:site_name', title.split('—')[0].trim() || title);
        if (description) {
          setMeta('name', 'description', description);
          setMeta('property', 'og:description', description);
        }
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased font-body-md text-body-md overflow-x-hidden selection:bg-primary-container selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
