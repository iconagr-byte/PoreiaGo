<!doctype html>
<html lang="el" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Source shell for Vite. Production HTML title/description are rewritten
      per office Host by /api/site/seo-shell (nginx @seo_shell). Build also
      writes dist/index.achillio.html + index.poreiago.html as static fallbacks.
    -->
    <title>PoreiaGo — Πλατφόρμα για ταξιδιωτικά γραφεία</title>
    <meta name="description" content="PoreiaGo — πλατφόρμα κρατήσεων, στόλου και wallet για ταξιδιωτικά γραφεία." />
    <meta property="og:title" content="PoreiaGo — Πλατφόρμα για ταξιδιωτικά γραφεία" />
    <meta property="og:description" content="PoreiaGo — πλατφόρμα κρατήσεων, στόλου και wallet για ταξιδιωτικά γραφεία." />
    <meta property="og:site_name" content="PoreiaGo" />
    <meta name="twitter:title" content="PoreiaGo — Πλατφόρμα για ταξιδιωτικά γραφεία" />
    <meta name="application-name" content="PoreiaGo" />
    <script>
      // Build-time flavor for Capacitor shells (app | wallet | driver). Vite/sync may rewrite.
      // Canonical install: app/wallet → com.poreiago.wallet (role-routed). driver = legacy only.
      window.__POREIAGO_NATIVE_APP__ = window.__POREIAGO_NATIVE_APP__ || '__POREIAGO_NATIVE_APP_PLACEHOLDER__';
    </script>
    <style id="poreiago-wallet-native-boot">
      /* Full-bleed My Wallet / Driver / Rent in Capacitor — no website chrome, fast fade */
      html[data-poreiago-app='app'],
      html[data-poreiago-app='app'] body,
      html[data-poreiago-app='app'] #root,
      html[data-poreiago-app='wallet'],
      html[data-poreiago-app='wallet'] body,
      html[data-poreiago-app='wallet'] #root,
      html[data-poreiago-app='driver'],
      html[data-poreiago-app='driver'] body,
      html[data-poreiago-app='driver'] #root {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        min-height: 100% !important;
        background: #ffffff !important;
        overflow-x: hidden !important;
      }
      html[data-poreiago-app='app'] .wallet-auth-stage,
      html[data-poreiago-app='app'] .wallet-auth-shell,
      html[data-poreiago-app='app'] .wallet-auth-scroll,
      html[data-poreiago-app='app'] .wallet-auth-panel,
      html[data-poreiago-app='app'] .wallet-auth-card,
      html[data-poreiago-app='wallet'] .wallet-auth-stage,
      html[data-poreiago-app='wallet'] .wallet-auth-shell,
      html[data-poreiago-app='wallet'] .wallet-auth-scroll,
      html[data-poreiago-app='wallet'] .wallet-auth-panel,
      html[data-poreiago-app='wallet'] .wallet-auth-card {
        background: #ffffff !important;
        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        width: 100% !important;
        max-width: none !important;
      }
      html[data-poreiago-app='app'] .wallet-auth-stage,
      html[data-poreiago-app='wallet'] .wallet-auth-stage {
        min-height: 100dvh !important;
        animation: pgWalletFade 160ms ease-out;
      }
      @keyframes pgWalletFade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      html[data-poreiago-app='app'] .wallet-auth-back,
      html[data-poreiago-app='wallet'] .wallet-auth-back {
        display: none !important;
      }
    </style>
    <script>
      (function () {
        // Capacitor unified / Wallet / Driver — mark app shell ASAP for full-bleed CSS
        try {
          var cap = window.Capacitor;
          var ua = String(navigator.userAgent || '');
          var host0 = String(location.hostname || '').toLowerCase();
          var port0 = String(location.port || '');
          var native =
            (cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform()) ||
            (cap && typeof cap.getPlatform === 'function' &&
              /^(android|ios)$/i.test(String(cap.getPlatform() || ''))) ||
            /Capacitor/i.test(ua) ||
            // Packaged Capacitor WebView only — never Vite (:5173) or other local ports
            (host0 === 'localhost' &&
              /^https?:$/.test(location.protocol || '') &&
              (!port0 || port0 === '80' || port0 === '443'));
          if (native) {
            var flavor = String(window.__POREIAGO_NATIVE_APP__ || '').toLowerCase();
            // Ignore unresolved Vite placeholder in web builds.
            if (flavor.indexOf('placeholder') >= 0) flavor = 'app';
            if (flavor !== 'driver' && flavor !== 'wallet' && flavor !== 'app') flavor = 'app';
            // Treat wallet marker as unified app shell.
            var shell = flavor === 'driver' ? 'driver' : 'app';
            document.documentElement.setAttribute('data-poreiago-app', shell);

            function driverSessionOk() {
              try {
                var raw = localStorage.getItem('driver_command_session');
                if (!raw) return false;
                var s = JSON.parse(raw);
                if (!s || !s.accessToken) return false;
                if (s.expiresAt && Date.now() > s.expiresAt * 1000) return false;
                return true;
              } catch (e) { return false; }
            }
            function customerSessionOk() {
              try {
                return (
                  localStorage.getItem('userRole') === 'customer' &&
                  !!localStorage.getItem('customer_access_token')
                );
              } catch (e) { return false; }
            }
            function resolveRoleHome() {
              if (driverSessionOk()) return '/driver';
              if (customerSessionOk()) {
                try {
                  var remembered = String(localStorage.getItem('poreiago_native_role_home_v1') || '')
                    .trim()
                    .toLowerCase();
                  if (remembered === 'rent') return '/rent/wallet';
                } catch (e) { /* ignore */ }
                return '/wallet';
              }
              return '/login';
            }
            function pathAllowed(path0) {
              return (
                path0 === '/driver' || path0.indexOf('/driver/') === 0 ||
                path0 === '/wallet' || path0.indexOf('/wallet/') === 0 ||
                path0 === '/rent' || path0.indexOf('/rent/') === 0 ||
                path0 === '/login' || path0 === '/register' ||
                path0.indexOf('/forgot-password') === 0 ||
                path0.indexOf('/reset-password') === 0 ||
                path0 === '/my-booking' || path0.indexOf('/my-booking/') === 0 ||
                path0.indexOf('/ticket/') === 0 ||
                path0.indexOf('/passenger-checkin') === 0 ||
                path0.indexOf('/sign/') === 0 ||
                // Wallet Κράτηση → seat → extras → checkout (keep deep link / reload)
                path0 === '/select-seat' || path0.indexOf('/select-seat/') === 0 ||
                path0.indexOf('/book/') === 0 ||
                path0.indexOf('/checkout') === 0 ||
                path0.indexOf('/trip/') === 0 ||
                path0.indexOf('/track/') === 0
              );
            }

            // Cold-start: role home (or keep an allowed deep link). history.replaceState
            // so Capacitor does not re-fetch a missing file.
            var path0 = location.pathname || '/';
            if (flavor === 'driver') {
              var driverOk =
                path0 === '/driver' ||
                path0.indexOf('/driver/') === 0;
              if (!driverOk) {
                history.replaceState(null, '', '/driver' + (location.search || '') + (location.hash || ''));
              }
            } else if (!pathAllowed(path0)) {
              var home = resolveRoleHome();
              history.replaceState(null, '', home + (location.search || '') + (location.hash || ''));
            }
          }
        } catch (e) { /* ignore */ }
        var host = (location.hostname || '').toLowerCase();
        // Apex without www was indexed by Google with a stale PoreiaGo title.
        // Prefer www as the single public URL (nginx 301 when Host/XFH survive NPM).
        if (host === 'achilliotravel.com') {
          location.replace(
            'https://www.achilliotravel.com' +
              location.pathname +
              location.search +
              location.hash
          );
          return;
        }
        var apex = host.replace(/^www\./, '');
        var known = { 'achilliotravel.com': 'Achillio Travel — Εκδρομές με λεωφορείο' };
        var knownDesc = {
          'achilliotravel.com':
            'Achillio Travel — εκδρομές με λεωφορείο στην Ελλάδα. Κράτηση θέσης, εισιτήρια και My Wallet στο achilliotravel.com.',
        };
        var platformApex =
          apex === 'poreiago.com' ||
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host === 'api.poreiago.com';
        var parts = apex.split('.');
        var isTenantSub =
          parts.length === 3 &&
          parts[1] === 'poreiago' &&
          parts[2] === 'com' &&
          parts[0] !== 'www' &&
          parts[0] !== 'api' &&
          parts[0] !== 'admin';
        var isTenantCustom = !platformApex && !apex.endsWith('.poreiago.com');
        var title;
        var description = '';
        if (known[apex]) {
          title = known[apex];
          description = knownDesc[apex] || '';
        } else if (isTenantSub || isTenantCustom) {
          var slug = (isTenantSub ? parts[0] : apex.split('.')[0]) || apex;
          title = slug.charAt(0).toUpperCase() + slug.slice(1);
        } else {
          return; // keep PoreiaGo marketing title
        }
        document.title = title;
        function setMeta(attr, key, value) {
          if (!value) return;
          var el = document.querySelector('meta[' + attr + '="' + key + '"]');
          if (!el) {
            el = document.createElement('meta');
            el.setAttribute(attr, key);
            document.head.appendChild(el);
          }
          el.setAttribute('content', value);
        }
        setMeta('property', 'og:title', title);
        setMeta('name', 'twitter:title', title);
        setMeta('name', 'application-name', title.split('—')[0].trim() || title);
        setMeta('property', 'og:site_name', title.split('—')[0].trim() || title);
        if (description) {
          setMeta('name', 'description', description);
          setMeta('property', 'og:description', description);
        }
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased font-body-md text-body-md overflow-x-hidden selection:bg-primary-container selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
