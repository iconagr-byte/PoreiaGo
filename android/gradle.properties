# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Prefer Android Studio / JetBrains Runtime 21 (not JDK 25).
# Studio must use the Gradle WRAPPER (8.14.3), NOT a local Gradle 9.6 install:
# Settings → Build Tools → Gradle → Use Gradle from = gradle-wrapper.properties
# Gradle JDK = jbr-21
# AGP 8.13 is incompatible with Gradle 9.6 (InternalProblems removed).
# Run config module = poreiago.app.main (settings.gradle rootProject.name).
# Prefer scripts/wallet-run.ps1; Studio Run after install often → Unknown error.
org.gradle.warning.mode=summary

# Google Credential Manager must be implementation for native Sign-In.

# SocialLogin Provider Dependencies (auto-generated)
# Generated by SocialLogin hook script
socialLogin.google.include=true
socialLogin.google.dependencyType=implementation
socialLogin.facebook.include=false
socialLogin.facebook.dependencyType=compileOnly
socialLogin.apple.include=false
socialLogin.apple.dependencyType=compileOnly
socialLogin.twitter.include=false
socialLogin.twitter.dependencyType=compileOnly
